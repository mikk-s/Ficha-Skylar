name: Teste de Diagnostico

on:
  push:
    branches:
      - main

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
    - name: Verificar se os Secrets existem
      run: |
        if [ -z "${{ secrets.FTP_SERVER }}" ]; then
          echo "❌ ERRO: O Secret FTP_SERVER esta VAZIO ou inacessivel para esta branch!"
          exit 1
        else
          echo "✅ Sucesso: O Secret FTP_SERVER foi encontrado pelo GitHub."
        fi